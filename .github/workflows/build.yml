# Builds on every push: the core and the wxWidgets app on Linux and Windows,
# and the Win32 app (until the wxWidgets one replaces it).
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (core and wxWidgets app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install wxWidgets
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwxgtk3.2-dev xvfb

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      # A static library links nothing, so link and run a small program that
      # calls into every part of the core to catch missing symbols too.
      - name: Link and run a smoke check of the core
        run: |
          cat > build/smoke.cpp <<'EOF'
          #include <iostream>
          #include <unistd.h>
          #include "mapdata.h"
          #include "reader.h"
          #include "refdata.h"

          int main() {
              u3::DosBoxReader reader(L"127.0.0.1", 8086);
              const bool attached = reader.Attach();  // no DOSBox here: must fail cleanly
              std::wcout << L"attach: " << attached << L" (" << reader.lastError << L")\n";
              std::wcout << L"game folder of this process: '" << u3::FindGameFolder(getpid()) << L"'\n";
              std::wcout << L"listener on 8086: " << u3::ListeningProcess(8086) << L"\n";
              std::wcout << L"process fallback: " << (u3::ConnectProcess() ? L"yes" : L"no") << L"\n";
              std::wcout << L"spell rows: " << u3::ref::TABLES[u3::ref::SPELLS].RowCount() << L"\n";
              std::wcout << L"world map pixels: " << u3::RenderWorld({}, u3::Tiles{}).size() << L"\n";
              u3::ExploredCells cells{};
              std::vector<uint8_t> level(u3::DUNGEON_SIZE * u3::DUNGEON_SIZE);  // an open level
              u3::ExploreView(cells, level.data(), 0, 0, 0, true);  // at the top-left corner, facing north
              std::wcout << L"explored: " << u3::ExploredToHex(cells) << L"\n";
              return attached ? 1 : 0;
          }
          EOF
          g++ -std=c++17 -Wall -Wextra -Icore build/smoke.cpp build/core/libu3core.a -pthread -o build/smoke
          ./build/smoke

      # Start the app on a virtual display: it should still be running after a
      # few seconds (timeout's exit status 124) rather than crash.
      - name: Start the app
        run: |
          set +e
          timeout 5 xvfb-run -a "./build/app/Ultima III Assistant"
          status=$?
          echo "exit status $status"
          test $status -eq 124

  windows:
    name: Windows (wxWidgets app)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-wxwidgets3.2-msw
            mingw-w64-x86_64-ntldd

      - name: Build
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      # The exe with the wxWidgets and MinGW runtime DLLs it needs beside it.
      - name: Gather the DLLs
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp "build/app/Ultima III Assistant.exe" dist/
          ntldd -R "dist/Ultima III Assistant.exe" | grep -i 'mingw64' | sed 's/.*=> //; s/ (0x.*//' | sort -u |
            while read -r dll; do cp "$(cygpath -u "$dll")" dist/; done
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: Ultima III Assistant (wxWidgets)
          path: dist/
          retention-days: 14

  windows-win32:
    name: Windows (Win32 app)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: Build Ultima III Assistant.exe
        shell: msys2 {0}
        run: cd u3stats-win32 && cmd //c build.cmd

      - uses: actions/upload-artifact@v7
        with:
          name: Ultima III Assistant
          path: u3stats-win32/Ultima III Assistant.exe
          retention-days: 14
