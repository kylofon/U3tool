# Layered on top of the GOG config by "Play in DOSBox Staging.cmd".
# Turns on DOSBox Staging's HTTP API, which Ultima III Assistant reads the
# game through. It only listens on this machine.

[webserver]
webserver_enabled = on
webserver_bind_address = 127.0.0.1
webserver_port = 8086

[cpu]
# The API is mainly tested with the normal core, and the game-speed patch
# needs a core that doesn't cache translated code.
core = normal
